<div class="container">
  <h2>Consulta de Entrega de Bienes</h2>

  <!-- Buscador -->
  <div class="buscador">
    <label for="comprobanteInput">Número de Comprobante:</label>
    <input
      id="comprobanteInput"
      type="number"
      [(ngModel)]="idComprobante"
      placeholder="Ej: 2568"
    />
    <button (click)="paginador.consultar()" [disabled]="paginador.cargando()">Buscar</button>
  </div>

  <!-- Mensajes de estado -->
  @if (paginador.cargando()) {
    <p class="mensaje">Cargando...</p>
  }

  @if (paginador.error()) {
    <p class="error">{{ paginador.error() }}</p>
  }

  <!-- Datos de los comprobantes -->
  @if (paginador.items().length > 0) {
    <app-generic-table
      [data]="paginador.items()"
      [columns]="columnas"
      [totalElements]="paginador.totalElements()"
      [pageIndex]="paginador.page()"
      [pageSize]="paginador.size()"
      (pageChange)="paginador.cambiarPagina($event)"
    />
  }
</div>
