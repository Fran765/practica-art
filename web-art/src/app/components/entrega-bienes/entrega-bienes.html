<div class="container">
  <h2>Consulta de Entrega de Bienes</h2>

  <!-- Buscador -->
  <div class="buscador">
    <label for="comprobanteInput">Número de Comprobante:</label>
    <input
      id="comprobanteInput"
      type="number"
      [(ngModel)]="idComprobante"
      placeholder="Ej: 2568"
    />
    <button (click)="consultar()" [disabled]="cargando()">Buscar</button>
  </div>

  <!-- Mensajes de estado -->
  @if (cargando()) {
    <p class="mensaje">Cargando...</p>
  }

  @if (error()) {
    <p class="error">{{ error() }}</p>
  }

  <!-- Datos de los comprobantes -->
  @if (comprobantes().length > 0) {
    <app-generic-table
      [data]="comprobantes()"
      [columns]="columnas"
      [totalElements]="totalElements()"
      [pageIndex]="page()"
      [pageSize]="size()"
      (pageChange)="cambiarPagina($event)"
    />
  }
</div>
